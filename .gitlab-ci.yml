stages:
  - test
  - publish

# Run unit tests on every push and merge request.
test:
  stage: test
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache bash jq
  script:
    - bash tests/test_grab_ip.sh
    - bash tests/test_merge_purge.sh

# Resolve domains and publish JSON snapshots hourly.
# Triggered by a scheduled pipeline (Settings > CI/CD > Schedules, hourly)
# or manually via the web UI (Run pipeline).
publish_ips:
  stage: publish
  image: alpine:latest
  variables:
    GIT_STRATEGY: clone
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apk add --no-cache bash bind-tools jq git curl coreutils
  script:
    - bash grab_ip.sh
    - bash ci/publish.sh
