stages:
  - test
  - build
  - publish

# Run unit tests on every push and merge request.
test:
  stage: test
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache bash jq
  script:
    - bash tests/test_grab_ip.sh
    - bash tests/test_merge_purge.sh

# Build the CI image with all tools pre-installed.
# Uses the host podman socket (mounted via runner volumes) — no DinD needed.
# The image lives in the GitLab Container Registry ($CI_REGISTRY_IMAGE:latest).
build_image:
  stage: build
  image: docker:24-cli
  variables:
    DOCKER_HOST: unix:///run/podman/podman.sock
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - Dockerfile
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web" && $BUILD_IMAGE == "true"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:latest"

# Resolve domains and publish JSON snapshots hourly.
# Uses the custom image — no package install needed at runtime.
# Triggered by a scheduled pipeline (Settings > CI/CD > Schedules, hourly)
# or manually via the web UI (Run pipeline).
publish_ips:
  stage: publish
  image: "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - bash grab_ip.sh
    - bash ci/publish.sh
